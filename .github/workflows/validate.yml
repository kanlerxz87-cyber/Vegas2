name: Validate static site

on:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate static pages and local links
        run: python scripts/check_site.py
      - name: Test dining search and filters
        run: node scripts/test_filters.js
      - name: Build Pages artifact
        run: python scripts/build_pages.py
